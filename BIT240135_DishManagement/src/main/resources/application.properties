spring.application.name=BIT240135_DishManagement

# ===== DATABASE BIT240135_MID: file H2 tự tạo trong thư mục ./data, KHÔNG cần tài khoản/mật khẩu =====
# DATABASE_TO_UPPER=false  -> giữ nguyên chữ hoa/thường của tên bảng, cột (BIT240135_Dishes, BIT240135_Name...)
spring.datasource.url=jdbc:h2:file:./data/BIT240135_MID;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Xem bảng/cột/dữ liệu trên trình duyệt: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:file:./data/BIT240135_MID;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
#   User: sa   Password: (để trống)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA: giữ NGUYÊN tên bảng/cột có tiền tố MSSV =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# ===== i18n: mặc định English =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.thymeleaf.cache=false
