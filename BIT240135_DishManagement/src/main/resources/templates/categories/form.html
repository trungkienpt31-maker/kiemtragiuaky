<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${titleKey})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width: 640px">
    <h2 class="mb-3" th:text="#{${titleKey}}">Category</h2>
    <form method="post" th:action="@{${action}}" th:object="${category}" novalidate>
        <div class="mb-3">
            <label class="form-label" for="name" th:text="#{category.name}">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description" th:text="#{category.description}">Description</label>
            <textarea class="form-control" id="description" rows="3" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
        <a class="btn btn-secondary" th:href="@{/categories}" th:text="#{common.cancel}">Cancel</a>
    </form>
</div>
</body>
</html>
