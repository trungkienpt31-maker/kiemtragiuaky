<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('category.list.title')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{category.list.title}">Categories</h2>
        <a class="btn btn-primary" th:href="@{/categories/new}" th:text="#{category.new}">New category</a>
    </div>
    <div th:replace="~{fragments :: flash}"></div>

    <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th th:text="#{common.id}">Id</th>
            <th th:text="#{category.name}">Name</th>
            <th th:text="#{category.description}">Description</th>
            <th th:text="#{category.dishCount}">Dishes</th>
            <th th:text="#{common.actions}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}">1</td>
            <td th:text="${c.name}">Name</td>
            <td th:text="${c.description}">Description</td>
            <td th:text="${#lists.size(c.dishes)}">0</td>
            <td class="text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/categories/{id}/edit(id=${c.id})}" th:text="#{common.edit}">Edit</a>
                <form class="d-inline" method="post" th:action="@{/categories/{id}/delete(id=${c.id})}"
                      th:attr="data-msg=#{common.confirmDelete}" onsubmit="return confirm(this.dataset.msg)">
                    <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{common.delete}">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
