<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titleKey)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{${titleKey}}">Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .thumb { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; }
        .gallery img { width: 100%; height: 180px; object-fit: cover; }
    </style>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dishes}" th:text="#{app.title}">Dish Management</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/dishes}" th:text="#{nav.dishes}">Dishes</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/categories}" th:text="#{nav.categories}">Categories</a></li>
        </ul>
        <div class="btn-group btn-group-sm" role="group" aria-label="language">
            <button type="button" onclick="switchLang('en')"
                    th:classappend="${#locale.language == 'en'} ? 'btn-light' : 'btn-outline-light'" class="btn">English</button>
            <button type="button" onclick="switchLang('vi')"
                    th:classappend="${#locale.language == 'vi'} ? 'btn-light' : 'btn-outline-light'" class="btn">Tiếng Việt</button>
        </div>
    </div>
    <script>
        // Giữ nguyên toàn bộ query string (điều kiện tìm kiếm/lọc/sắp xếp) khi đổi ngôn ngữ
        function switchLang(lang) {
            var url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }
    </script>
</nav>
<div th:fragment="flash">
    <div class="alert alert-success" th:if="${success}" th:text="#{${success}}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="#{${error}}"></div>
</div>
</body>
</html>
