<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('dish.detail.title')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <div th:replace="~{fragments :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${dish.name}">Dish</h2>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/dishes/{id}/edit(id=${dish.id})}" th:text="#{common.edit}">Edit</a>
            <a class="btn btn-secondary" th:href="@{/dishes}" th:text="#{common.back}">Back</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3" th:text="#{dish.category}">Category</dt>
                <dd class="col-sm-9" th:text="${dish.category.name}">-</dd>
                <dt class="col-sm-3" th:text="#{dish.price}">Price</dt>
                <dd class="col-sm-9" th:text="${#numbers.formatDecimal(dish.price, 1, 'COMMA', 2, 'POINT')}">0</dd>
                <dt class="col-sm-3" th:text="#{dish.preparationTime}">Time</dt>
                <dd class="col-sm-9">
                    <span th:text="${dish.preparationTime} + ' ' + #{common.minutes}">10 min</span>
                    <span class="badge" th:classappend="${dish.quick} ? 'bg-success' : 'bg-warning text-dark'"
                          th:text="${dish.quick} ? #{prep.quick} : #{prep.regular}">Quick</span>
                </dd>
                <dt class="col-sm-3" th:text="#{filter.status}">Status</dt>
                <dd class="col-sm-9">
                    <span class="badge" th:classappend="${dish.isAvailable} ? 'bg-primary' : 'bg-secondary'"
                          th:text="${dish.isAvailable} ? #{status.available} : #{status.unavailable}">Available</span>
                </dd>
                <dt class="col-sm-3" th:text="#{dish.description}">Description</dt>
                <dd class="col-sm-9" th:text="${dish.description}">-</dd>
            </dl>
        </div>
    </div>

    <h4 th:text="#{image.title}">Images</h4>
    <div class="alert alert-info" th:if="${#lists.isEmpty(dish.images)}" th:text="#{image.empty}">No images.</div>

    <div class="row gallery mb-4" th:unless="${#lists.isEmpty(dish.images)}">
        <div class="col-md-4 mb-3" th:each="img : ${dish.images}">
            <div class="card h-100" th:classappend="${img.isThumbnail} ? 'border-primary border-2'">
                <img class="card-img-top" th:src="${img.imageUrl}" alt="">
                <div class="card-body p-2">
                    <span class="badge bg-primary mb-2" th:if="${img.isThumbnail}" th:text="#{image.thumbnail}">Thumbnail</span>
                    <div class="d-flex gap-1">
                        <form method="post" th:unless="${img.isThumbnail}"
                              th:action="@{/dishes/{d}/images/{i}/thumbnail(d=${dish.id},i=${img.id})}">
                            <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{image.setThumbnail}">Set</button>
                        </form>
                        <form method="post" th:action="@{/dishes/{d}/images/{i}/delete(d=${dish.id},i=${img.id})}"
                              th:attr="data-msg=#{common.confirmDelete}" onsubmit="return confirm(this.dataset.msg)">
                            <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{common.delete}">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-5">
        <div class="card-header" th:text="#{image.add}">Add image</div>
        <div class="card-body">
            <form method="post" th:action="@{/dishes/{id}/images(id=${dish.id})}" class="row g-2 align-items-center">
                <div class="col-md-7">
                    <input type="text" class="form-control" name="imageUrl" th:placeholder="#{image.url}" placeholder="Image URL">
                </div>
                <div class="col-md-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="isThumbnail" name="isThumbnail" value="true">
                        <label class="form-check-label" for="isThumbnail" th:text="#{image.isThumbnail}">Use as thumbnail</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100" th:text="#{common.add}">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
